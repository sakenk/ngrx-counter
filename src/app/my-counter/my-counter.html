<div class="counter-container">
  <h2>Counter</h2>
  <div class="count-display">
    Current Count: <span class="count-value">{{ count$ | async }}</span>
  </div>
  <div class="button-group">
    <button class="counter-btn" (click)="increment()">Increment</button>
    <button class="counter-btn" (click)="decrement()">Decrement</button>
    <button class="counter-btn reset" (click)="reset()">Reset Counter</button>
  </div>
</div>
